# cargo-about: collects the license text of every dependency into
# THIRD-PARTY-NOTICES.md. Run it when preparing a binary release:
#
#   cargo about generate about.hbs > THIRD-PARTY-NOTICES.md
#
# The list below must match `[licenses] allow` in deny.toml.
accepted = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "ISC",
    "MIT",
    "MIT-0",
    "MPL-2.0",
    "NCSA",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]

# Glance is built for all three desktop platforms, so list what each one pulls in.
targets = [
    "aarch64-apple-darwin",
    "x86_64-apple-darwin",
    "x86_64-unknown-linux-gnu",
    "x86_64-pc-windows-msvc",
]

ignore-dev-dependencies = true
